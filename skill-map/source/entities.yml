# Hand-authored entities the pipeline can't derive from GitHub:
# professional experience, and the curated "story mode" groupings behind
# the narrative-path buttons.
#
# Capability and domain nodes are generated automatically from whatever
# ids in scripts/skill_map/ontology.py actually receive evidence during
# a build — this file only adds what a script cannot know.

experience:
  - id: e-progressive
    name: Progressive Insurance
    role: AI Engineer
    period: "May 2024 – Present"
    domains: [insurance]
    detail: >
      Engineered NLP and computer-vision models using TensorFlow and
      PyTorch to classify claim texts, forms, and images. Built ML
      pipelines with Apache Airflow and Azure Data Factory, deployed to
      Azure ML Services — 35% reduction in manual claim processing time,
      25% improvement in fraud detection.
    technologies: [tensorflow, pytorch, azure, mlflow, sql, docker, python, airflow]
    capabilities: [nlp, computer-vision, mlops, data-engineering]

  - id: e-iu
    name: Indiana University
    role: Research Assistant
    period: "Dec 2023 – May 2024"
    domains: [education]
    detail: >
      Improved transcript accuracy by 18 percentage points using a GPT-4
      RAG pipeline on the BigRed200 HPC cluster, processing 200+ hours of
      esports video. Cut chat latency 40% with a sentiment microservice
      handling 1M+ messages in near real time.
    technologies: [openai, langchain, sklearn, python]
    capabilities: [rag, nlp, information-retrieval]

  - id: e-ibm
    name: IBM
    role: Data Analyst
    period: "Sep 2020 – Jun 2022"
    domains: [finance]
    detail: >
      Led churn prediction model development in Python and Scikit-learn —
      20% reduction in customer attrition. Refactored ETL workflows with
      Azure Data Lake and SQL for 15% faster data availability, and
      shipped models to Azure ML behind CI/CD for 25% faster releases.
    technologies: [python, sklearn, azure, sql]
    capabilities: [classification, data-engineering, mlops]

