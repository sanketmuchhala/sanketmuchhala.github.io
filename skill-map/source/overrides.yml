  TallyCart:
    tier: extended
    domains: [e-commerce]
  WindowPilot:
    tier: extended
    domains: [developer-tooling]
  jobfit:
    tier: extended
    display_name: JD Keyword Extractor
    capabilities: [nlp]
  Superstore-Sales-Management-Dashboard:
    tier: extended
    display_name: Superstore Sales Dashboard
    capabilities: [forecasting]
  Project-Patent-Classification:
    tier: extended
    display_name: Regional Impact of Patents
    capabilities: [nlp, classification]
  Game-analytics:
    tier: extended
    display_name: Chat & Gameplay Correlation
    capabilities: [nlp]
  ECC-LBFS:
    tier: extended
    display_name: Location-Based File Sharing

# ── Narrative relationships — CURATED ONLY ──────────────────────────
# Never inferred from similarity, dates, dependencies, or shared
# technologies. Each type means something different:
#   EVOLVED_INTO        earlier work of mine matured into later work
#   DERIVED_FROM        built on top of someone else's upstream work
#   INSPIRED_BY         idea borrowed, code not
#   SHARES_PATTERN_WITH same technique, different context
#   RELATED_TO          generic sibling relationship
narrative_edges:
  - from: RAG-Chatbot-Jupyter
    to: FileChatAI
    type: SHARES_PATTERN_WITH
    context: >
      Two parallel first passes at retrieval in 2024 — the same
      embed/index/retrieve pattern, once in notebooks and once behind a
      Streamlit UI.
  - from: FileChatAI
    to: LexOrchestrator
    type: EVOLVED_INTO
    context: >
      Single-document retrieval grew into a production-shaped hybrid
      pipeline — keyword, vector, and authority signals ranked together
      over a real corpus.
  - from: RAG-Chatbot-Jupyter
    to: LexOrchestrator
    type: EVOLVED_INTO
    context: >
      The notebook retrieval experiments became the retrieval stage of an
      eight-agent workflow.
  - from: LexOrchestrator
    to: matter-graph-legal-ai
    type: EVOLVED_INTO
    context: >
      The litigation-agent demo's orchestration and evidence handling
      became the foundation of a production legal-tech product.
  - from: ApplicationAgent
    to: LexOrchestrator
    type: SHARES_PATTERN_WITH
    context: >
      Both expose their capabilities as MCP tools so an external agent
      can drive them — one for job applications, one for litigation work.
  - from: Project-AirNet
    to: US-Metro-Transit-Network-Mega-Visualization
    type: SHARES_PATTERN_WITH
    context: >
      The same network-theory toolkit — centrality, clustering,
      targeted-removal failure analysis — applied to air routes and then
      to metro systems.
  - from: Linkedin-Connections
    to: LanguageLineage
    type: SHARES_PATTERN_WITH
    context: >
      Graph analysis moved from a private social export to a public,
      citation-backed dataset built for other people to explore.
  - from: mirofish-api-server
    to: GTM-SImulator
    type: SHARES_PATTERN_WITH
    context: >
      Two productizations of the same upstream swarm engine — one as a
      metered prediction API, one as a go-to-market simulation lab.

hidden: []
